configs:
  example-domain-local-crt:
    file: ./example-domain.local.crt

secrets:
  example-domain-local-key:
    file: ./example-domain.local.key

services:
  nginx-proxy:
    image: ${DOCKER_REGISTRY:-docker.io}/linkedmink/nginx-proxy
    build:
      context: ./
      args:
        ALPINE_VERSION: ${ALPINE_VERSION}
      labels:
        net.linkedmink.author: "Harlan Sang"
        net.linkedmink.repository: "https://github.com/LinkedMink/base-images/nginx-proxy"
      tags:
        - "${DOCKER_REGISTRY:-docker.io}/linkedmink/nginx-proxy:${NGINX_PROXY_MAJOR_VERSION}-alpine"
        - "${DOCKER_REGISTRY:-docker.io}/linkedmink/nginx-proxy:${NGINX_PROXY_MAJOR_VERSION}-alpine${ALPINE_MAJOR_VERSION}"
        - "${DOCKER_REGISTRY:-docker.io}/linkedmink/nginx-proxy:${NGINX_PROXY_MAJOR_VERSION}-alpine${ALPINE_VERSION}"
        - "${DOCKER_REGISTRY:-docker.io}/linkedmink/nginx-proxy:${NGINX_PROXY_MINOR_VERSION}-alpine"
        - "${DOCKER_REGISTRY:-docker.io}/linkedmink/nginx-proxy:${NGINX_PROXY_MINOR_VERSION}-alpine${ALPINE_MAJOR_VERSION}"
        - "${DOCKER_REGISTRY:-docker.io}/linkedmink/nginx-proxy:${NGINX_PROXY_MINOR_VERSION}-alpine${ALPINE_VERSION}"
        - "${DOCKER_REGISTRY:-docker.io}/linkedmink/nginx-proxy:${NGINX_PROXY_VERSION}-alpine"
        - "${DOCKER_REGISTRY:-docker.io}/linkedmink/nginx-proxy:${NGINX_PROXY_VERSION}-alpine${ALPINE_MAJOR_VERSION}"
        - "${DOCKER_REGISTRY:-docker.io}/linkedmink/nginx-proxy:${NGINX_PROXY_VERSION}-alpine${ALPINE_VERSION}"
        - "${DOCKER_REGISTRY:-docker.io}/linkedmink/nginx-proxy:${NGINX_PROXY_MAJOR_VERSION}"
        - "${DOCKER_REGISTRY:-docker.io}/linkedmink/nginx-proxy:${NGINX_PROXY_MINOR_VERSION}"
        - "${DOCKER_REGISTRY:-docker.io}/linkedmink/nginx-proxy:${NGINX_PROXY_VERSION}"
      platforms:
        - "linux/amd64"
        - "linux/arm64"
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "443:443/udp"
    cap_add:
      - NET_ADMIN
      - BPF
      - PERFMON
    configs:
      - source: example-domain-local-crt
        target: /etc/ssl/certs/example-domain.local.crt
    secrets:
      - source: example-domain-local-key
        target: example-domain.local.key
    volumes:
      - type: bind
        source: ./example-domain.local
        target: /srv/example-domain.local
      - type: bind
        source: ./http.d
        target: /etc/nginx/http.d
